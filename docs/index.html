<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMET</title>
<meta name="description" content="A consultancy practising empathic agent design.">
<meta name="theme-color" content="#1c211d">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
  :root { --deep: #1c211d; --sage: #9db3a1; --light: #eef0e9; --clay: #d98657; --rule: #333c34; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--deep); color: var(--light); }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

  .hero {
    position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2.5rem 1.5rem 7.5rem;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .content { position: relative; z-index: 2; }

  .eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.75rem;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--clay); margin: 0 0 1.25rem;
  }
  h1 { margin: 0; }
  .logo-wrap { position: relative; width: min(clamp(160px, 38vw, 340px), 38vh); margin: 0 auto; }
  .logo-wrap img { display: block; width: 100%; height: auto; }
  .logo-wrap .cursor { position: absolute; inset: 0; animation: blink 1.1s steps(1, end) infinite; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .tagline {
    color: var(--sage); font-size: clamp(1rem, 3.2vw, 1.2rem);
    max-width: 32ch; margin: 1.5rem auto 0; line-height: 1.6;
  }

  .meta {
    position: relative; z-index: 2; margin-top: 2.25rem;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 2rem;
    padding: 0 1.5rem;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.78rem;
    letter-spacing: 0.06em; color: var(--sage);
  }
  .meta strong { color: var(--clay); font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; margin-right: 0.5rem; }

  @media (prefers-reduced-motion: reduce) { .logo-wrap .cursor { animation: none; } }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html" aria-label="EMET home">
    <img src="logo-inline.png" alt="EMET">
    <img class="cursor" src="logo-inline-cursor.png" alt="" aria-hidden="true">
  </a>
  <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
  <nav class="nav" id="site-nav" aria-label="Main">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="team.html">Team</a>
    <a href="blog.html">Blog</a>
    <a class="cta" href="contact.html">Let&rsquo;s Talk</a>
  </nav>
</header>
<section class="hero">
  <canvas id="waves" aria-hidden="true"></canvas>
  <div class="content">
    <p class="eyebrow">Empathic agent design</p>
    <h1 class="logo-wrap">
      <img src="logo.png" alt="EMET — אמת">
      <img class="cursor" src="logo-cursor.png" alt="" aria-hidden="true">
    </h1>
    <p class="tagline">A consultancy practising empathic agent design.</p>
    <div class="meta">
      <span><strong>Workshop</strong>October 2, 2026</span>
      <span>This site co-created with Emet Agent.</span>
    </div>
  </div>
</section>
<script>
(() => {
  const c = document.getElementById('waves');
  const ctx = c.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SAGE = '157,179,161', CLAY = '217,134,87';
  let w, h;

  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.clientWidth; h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    const lines = w < 600 ? 16 : 26;
    for (let i = 0; i < lines; i++) {
      const k = i / (lines - 1);
      const baseY = h * (0.15 + 0.7 * k);
      const isClay = i === Math.floor(lines * 0.62);
      ctx.beginPath();
      for (let x = 0; x <= w; x += 6) {
        const y = baseY
          + Math.sin(x * 0.004 + t * 0.00035 + i * 0.35) * 26
          + Math.sin(x * 0.0017 - t * 0.00022 + i * 0.6) * 38 * (0.4 + k);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = isClay ? `rgba(${CLAY},0.7)` : `rgba(${SAGE},${0.10 + 0.18 * Math.sin(k * Math.PI)})`;
      ctx.lineWidth = isClay ? 1.4 : 1;
      ctx.stroke();
    }
    if (!reduce) requestAnimationFrame(draw);
  }

  fit();
  requestAnimationFrame(draw);
  let rt;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { fit(); if (reduce) draw(0); }, 150);
  });
})();
</script>
<script src="site.js"></script>
</body>
</html>
